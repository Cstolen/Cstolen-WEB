<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #enter {
    position: fixed; inset: 0; width: 100%; height: 100%;
    border: 0; background: #000; color: #fff; cursor: pointer;
    font: 600 1.5rem system-ui, sans-serif; letter-spacing: 0.05em;
  }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<button id="enter">Click to enter</button>
<script>
  document.getElementById('enter').addEventListener('click', function () {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&loop=1&playlist=dQw4w9WgXcQ&controls=0';
    f.allow = 'autoplay; encrypted-media; fullscreen';
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.title = 'Welcome';
    document.body.replaceChildren(f);
  });
</script>
</body>
</html>
